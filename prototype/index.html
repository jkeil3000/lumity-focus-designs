  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: "";
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed="true"],
  [aria-selected="true"],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed="true"], [aria-selected="true"], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type="file"]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type="color"] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type="date"],
    [type="datetime-local"],
    [type="month"],
    [type="time"],
    [type="week"]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: "";
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget > svg {

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {

  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

<script>
(()=>{
const root=document.getElementById('focus-four'),view=root.querySelector('#f-view'),screenPicker=root.querySelector('#preview-screen'),appPicker=root.querySelector('#preview-app'),result=root.querySelector('#preview-result'),next=root.querySelector('#preview-next');
const sources={tao:'https://www.gutenberg.org/files/216/216-h/216-h.htm',epictetus:'https://classics.mit.edu/Epictetus/epicench.html',franklin:'https://www.gutenberg.org/files/148/148-h/148-h.htm',emerson:'https://www.gutenberg.org/cache/epub/2944/pg2944-images.html'};
const library={
Spiritual:[
{id:'tao64',body:'The tree which fills the arms grew from the tiniest sprout; the tower of nine storeys rose from a (small) heap of earth; the journey of a thousand li commenced with a single step.',author:'Laozi',work:'Tao Te Ching · Chapter 64',edition:'James Legge translation',url:sources.tao,prompt:'What is one small beginning you have been putting off?'},
{id:'tao33',body:'He who knows other men is discerning; he who knows himself is intelligent. He who overcomes others is strong; he who overcomes himself is mighty. He who is satisfied with his lot is rich; he who goes on acting with energy has a (firm) will.',author:'Laozi',work:'Tao Te Ching · Chapter 33',edition:'James Legge translation',url:sources.tao,prompt:'What have you learned about yourself recently?'}],
Philosophical:[
{id:'epictetus1',body:'Some things are in our control and others not. Things in our control are opinion, pursuit, desire, aversion, and, in a word, whatever are our own actions. Things not in our control are body, property, reputation, command, and, in one word, whatever are not our own actions.',author:'Epictetus',work:'The Enchiridion · Section 1',edition:'Internet Classics Archive text',url:sources.epictetus,prompt:'What is within your control today?'},
{id:'epictetus1b',body:'Work, therefore to be able to say to every harsh appearance, “You are but an appearance, and not absolutely the thing you appear to be.” And then examine it by those rules which you have, and first, and chiefly, by this: whether it concerns the things which are in our own control, or those which are not; and, if it concerns anything not in our control, be prepared to say that it is nothing to you.',author:'Epictetus',work:'The Enchiridion · Section 1',edition:'Internet Classics Archive text',url:sources.epictetus,prompt:'Is there an assumption you could look at again?'}],
Entrepreneur:[
{id:'franklinhabit',body:'My intention being to acquire the habitude of all these virtues, I judg’d it would be well not to distract my attention by attempting the whole at once, but to fix it on one of them at a time; and, when I should be master of that, then to proceed to another, and so on, till I should have gone thro’ the thirteen;',author:'Benjamin Franklin',work:'The Autobiography · Excerpt',edition:'1909 edition',url:sources.franklin,prompt:'What would you choose to work on one at a time?'},
{id:'franklinindustry',body:'Lose no time; be always employ’d in something useful; cut off all unnecessary actions.',author:'Benjamin Franklin',work:'The Autobiography · Industry',edition:'1909 edition',url:sources.franklin,prompt:'What would make today feel well spent to you?'}],
Creative:[
{id:'emersonlight',body:'A man should learn to detect and watch that gleam of light which flashes across his mind from within, more than the lustre of the firmament of bards and sages. Yet he dismisses without notice his thought, because it is his. In every work of genius we recognize our own rejected thoughts; they come back to us with a certain alienated majesty.',author:'Ralph Waldo Emerson',work:'Self-Reliance · Essays, First Series',edition:'1841',url:sources.emerson,prompt:'What idea of your own deserves another look?'},
{id:'emersonthought',body:'To believe your own thought, to believe that what is true for you in your private heart is true for all men,—that is genius. Speak your latent conviction, and it shall be the universal sense;',author:'Ralph Waldo Emerson',work:'Self-Reliance · Excerpt',edition:'1841',url:sources.emerson,prompt:'What would you make if you trusted your own taste?'}],
Reset:[
{id:'resetbox',title:'Box breathing',body:'Box breathe: inhale 4, hold 4, exhale 4, hold 4. Repeat four times.',alternative:'Stop if uncomfortable; return to normal breathing.',author:'Lumity Focus',work:'Reset · 64 seconds',prompt:'What does this bring up for you?'},
{id:'resetfive',title:'Five slow breaths',body:'Take five slow breaths.',alternative:'Let the exhale be slightly longer than the inhale.',author:'Lumity Focus',work:'Reset · 45 seconds',prompt:'What does this bring up for you?'}],

{id:'relationshipthinking',title:'Text someone: “Thinking about you.”',body:'Text someone: “Thinking about you.”',alternative:'Edit the words so they sound like you.',author:'Lumity Focus',work:'Relationships · About 30 seconds',prompt:'What does this bring up for you?'}],

{id:'movementpushups',title:'Do 10 push-ups.',body:'Do 10 push-ups.',alternative:'Use a wall, desk, or knees if preferred.',author:'Lumity Focus',work:'Movement · About 45 seconds',prompt:'What does this bring up for you?'}]

function localDay(){const d=new Date();return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;}

function beginEditor(id=null){const r=state.rules.find(r=>r.id===id);state.editor={id:r?.id||null,mode:r&&r.apps.length>1?'group':'app',name:r?.name||'Social',apps:[...(r?.apps||[])],minutes:r?.minutes||10,daily:r?.daily||30};state.page='editor';state.exited=false;render();}
function saveRule(){const e=state.editor;if(!e||!e.apps.length||!Number.isInteger(e.minutes)||!Number.isInteger(e.daily)||e.minutes<1||e.daily<1||e.minutes>1440||e.daily>1440||e.mode==='group'&&(e.apps.length<2||!e.name.trim()))return false;

// Keep app-level usage when regrouping. Removed group members retain an individual limit.
const detached=old?old.apps.filter(a=>!e.apps.includes(a)).map((a,i)=>({id:id+'-detached-'+i,name:a,apps:[a],minutes:old.minutes,daily:old.daily})):[];
state.rules=state.rules.filter(r=>r.id!==e.id).map(r=>({...r,apps:r.apps.filter(a=>!e.apps.includes(a))})).filter(r=>r.apps.length).map(r=>({...r,name:r.apps.length===1?r.apps[0]:r.name}));
state.rules.push(...detached,{id,name:e.mode==='app'?e.apps[0]:e.name.trim(),apps:[...e.apps],minutes:e.minutes,daily:e.daily});state.selected=new Set(state.rules.flatMap(r=>r.apps));state.editor=null;state.page='home';return true;}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function paragraphs(item){
if(item.id==='tao64')return ['The tree which fills the arms\ngrew from the tiniest sprout;','the tower of nine storeys\nrose from a (small) heap of earth;','the journey of a thousand li\ncommenced with a single step.'];
if(item.id==='tao33')return ['He who knows other men is discerning; he who knows himself is intelligent.','He who overcomes others is strong; he who overcomes himself is mighty.','He who is satisfied with his lot is rich; he who goes on acting with energy has a (firm) will.'];
if(item.id==='franklinhabit')return ['My intention being to acquire the habitude of all these virtues, I judg’d it would be well not to distract my attention by attempting the whole at once,','but to fix it on one of them at a time;','and, when I should be master of that, then to proceed to another, and so on, till I should have gone thro’ the thirteen;'];
if(item.id==='epictetus1b')return ['Work, therefore to be able to say to every harsh appearance, “You are but an appearance, and not absolutely the thing you appear to be.”','And then examine it by those rules which you have, and first, and chiefly, by this: whether it concerns the things which are in our own control, or those which are not;','and, if it concerns anything not in our control, be prepared to say that it is nothing to you.'];
return item.body.match(/[^.!?]+(?:[.!?][”"]?|$)/g)?.map(p=>p.trim()).filter(Boolean)||[item.body];
}
function passage(item){return `<div class="f-passages">${paragraphs(item).map(p=>`<p>${esc(p).replace(/\n/g,'<br>')}</p>`).join('')}</div>`;}

function render(){
refreshDay();root.dataset.appearance=state.appearance;screenPicker.value=state.page==='editor'?'home':state.page==='read'&&state.category==='Reset'?'reset':state.page==='read'&&state.category==='Movement'?'movement':state.page;appPicker.value=state.app;const a=allowance();

if(!state.exited){result.textContent='Design preview · Sample daily counts · No apps are actually blocked';next.hidden=true;}

const item=state.item,words=item.body.split(/\s+/).length;
view.innerHTML=`${context()}${practices[item.id]?practice(item):`<article><div class="f-meta"><span class="f-kicker">${state.category}</span><span>${words<55?'30 sec':'1 min'} read</span></div><h1>${esc(item.work.split(' · ')[0])}</h1><p class="f-edition"><a href="${item.url}" target="_blank" rel="noopener noreferrer">${esc(item.work.includes(' · ')?item.work.split(' · ').slice(1).join(' · '):'View source')}</a></p>${passage(item)}<div class="f-credit"><span>— ${esc(item.author)}${item.edition?`<span>${esc(item.edition)}</span>`:''}</span></div></article>`}<details class="f-optional" ${state.draft?'open':''}><summary>${icon('pen-line')}Add a reflection<span>Optional ${icon('plus')}</span></summary><div class="f-reflection"><label for="f-reflection">${esc(item.prompt)}</label><textarea id="f-reflection" placeholder="What does this bring up for you?">${esc(state.draft)}</textarea>${button(state.saved?'Saved':'Save reflection','save','secondary',!state.draft.trim()||state.saved)}<p id="f-save-result" role="status"></p></div></details><div class="f-grow"></div><div class="f-actions">${button('Return to my day','leave')}${button(a.remaining?`Continue to ${esc(state.app)} · ${Math.min(a.rule.minutes,a.remaining)} min`:'Daily allowance reached','continue','text-button',!a.remaining||state.exited)}</div>`;
}
if(state.page==='choose')view.innerHTML=`${context()}<h1>What do you want<br>to lean into?</h1><div class="f-surprise">${button(`${icon('shuffle')} Surprise me`,'surprise')}</div><div class="f-category-list"><p class="f-kicker f-section-label">Read something</p>${Object.keys(icons).map((cat,i)=>`${i===4?'<p class="f-kicker f-section-label">Do something</p>':''}<button class="f-category-row" data-category="${cat}"><span class="f-category-icon">${icon(icons[cat])}</span><span class="f-category-label">${cat}<small>${descriptions[cat]}</small></span>${icon('chevron-right')}</button>`).join('')}</div>`;
if(state.page==='shield'){
view.innerHTML=`<div class="f-grow"></div><p class="f-kicker">${esc(state.app)}</p><h1 style="margin-top:13px">${a.remaining?'Before you open.':'That’s your limit<br>for today.'}</h1><div class="f-allowance"><div class="f-allowance-top"><strong>${a.opens} ${a.opens===1?'open':'opens'}</strong><span>today</span></div><div class="f-track" aria-label="${a.allocated} of ${a.rule?.daily||0} minutes allotted"><span style="width:${a.rule?Math.min(100,a.allocated/a.rule.daily*100):0}%"></span></div><p>${a.rule?.apps.length>1?`${esc(a.rule.name)} · ${a.remaining} shared minutes left`:a.remaining?`${Math.ceil(a.remaining/a.rule.minutes)} opens remaining · ${a.remaining} min left`:`${a.rule?.daily||0} min allotted · Resets tomorrow`}</p></div><div class="f-grow"></div>${a.remaining?button('Open Lumity Focus','choose'):''}${button('Return to my day','leave',a.remaining?'text-button':'primary')}`;
result.textContent='System shield concept · Native layout and counts require device validation';
}
if(state.page==='home'){
view.innerHTML=`<h2>Your limits</h2><p class="f-sub">Set an allowance for an app or a group.</p><div class="f-rule-list">${state.rules.map(r=>{const log=allowance(r.apps[0]);return `<button class="f-rule-row" data-rule="${r.id}"><span class="f-rule-text"><span class="f-rule-title">${esc(r.name)}</span>${r.apps.length>1?`<span class="f-rule-members">${r.apps.map(esc).join(' · ')}</span>`:''}<span class="f-rule-detail">${r.minutes} min / open · ${r.daily} min / day${r.apps.length>1?' shared':''}</span><span class="f-rule-usage">${log.remaining} min left today</span></span>${icon('chevron-right')}</button>`;}).join('')}</div>${button(`${icon('plus')} Add a limit`,'add-rule','secondary')}<div class="f-setting"><label for="f-theme">Appearance</label><select id="f-theme"><option value="light" ${state.appearance==='light'?'selected':''}>Light</option><option value="dark" ${state.appearance==='dark'?'selected':''}>Dark</option></select></div><div class="f-setting">${button(`Saved reflections ${icon('chevron-right')}`,'journal','setting-link')}</div>`;
}
if(state.page==='editor'){
const e=state.editor;
view.innerHTML=`<button class="f-back" data-action="cancel-editor">${icon('arrow-left')}Your limits</button><h2>${e.id?'Edit limit':'New limit'}</h2><div class="f-segments" role="group" aria-label="Limit type"><button data-mode="app" aria-pressed="${e.mode==='app'}">One app</button><button data-mode="group" aria-pressed="${e.mode==='group'}">App group</button></div>${e.mode==='group'?`<label class="f-field-label" for="f-group-name">Group name</label><input class="f-field" id="f-group-name" value="${esc(e.name)}" maxlength="40">`:''}<p class="f-kicker f-section-label">${e.mode==='group'?'Choose apps':'Choose an app'}</p><div>${apps.map(app=>`<label class="f-app-row"><span>${app}</span><input type="${e.mode==='app'?'radio':'checkbox'}" name="limit-app" data-rule-app="${app}" ${e.apps.includes(app)?'checked':''}></label>`).join('')}</div><p class="f-help">${e.mode==='group'?'These apps share one daily allowance. Each unlock opens only the app you requested.':'This allowance applies only to the selected app.'}</p><p class="f-help" id="f-transfer-note"></p><div class="f-setting"><label for="f-minutes">Time per open</label><span class="f-number"><input id="f-minutes" type="number" min="1" max="1440" step="1" value="${e.minutes}">min</span></div><div class="f-setting"><label for="f-daily">Daily allowance</label><span class="f-number"><input id="f-daily" type="number" min="1" max="1440" step="1" value="${e.daily}">min</span></div><p class="f-error" id="f-setting-error" role="alert" hidden>Choose whole minutes between 1 and 1,440.</p><div class="f-grow"></div>${button('Save limit','save-rule')}`;
}
if(state.page==='welcome')view.innerHTML=`<div class="f-grow"></div><p class="f-kicker">Lumity Focus</p><h1 style="margin-top:15px">Give your attention<br>something good.</h1><p class="f-sub">A passage, an idea, or a small reset<br>before the apps you reach for.</p><div class="f-intro-quote">The journey of a thousand li<br>commenced with a single step.</div><p class="f-edition">Laozi · Tao Te Ching</p><div class="f-grow"></div>${button('Get started','permission')}`;
if(state.page==='permission')view.innerHTML=`<div class="f-grow"></div><p class="f-kicker">Getting started</p><h1 style="margin-top:15px">Connect<br>Screen Time.</h1><p class="f-sub">Allow Lumity Focus to block the apps you choose and apply your daily limits.</p><div class="f-grow"></div>${button('Allow Screen Time access','apps')}`;
if(state.page==='apps'){
view.innerHTML=`<h2>Choose your apps</h2><p class="f-sub">Which apps would you like to limit?</p><input id="f-search" class="f-search" type="search" aria-label="Search apps" placeholder="Search apps">${['Instagram','TikTok','YouTube','X','Reddit'].map(app=>`<label class="f-app-row" data-app-row="${app}"><span class="f-app">${app}</span><input type="checkbox" aria-label="Block ${app}" data-app="${app}" ${state.selected.has(app)?'checked':''}></label>`).join('')}<p id="f-no-results" class="f-help" hidden>No matching apps in this preview.</p><div class="f-grow"></div>${button('Save apps','home')}`;result.textContent='Picker approximation · The native app will use Apple’s app picker';
}
if(state.page==='journal')view.innerHTML=`<h2>Saved reflections</h2>${state.entries.length?state.entries.slice().reverse().map(e=>`<article class="f-journal"><p class="f-kicker">${e.date} · ${e.category}</p><p>${esc(e.text)}</p><details><summary>View original ${icon('chevron-down')}</summary>${practices[e.item.id]?practice(e.item,e.category):passage(e.item)}<p class="f-edition">${esc(e.item.author)} · ${esc(e.item.work)}</p></details></article>`).join(''):'<p class="f-empty">The reflections you save will live here, alongside the passage or practice.</p>'}`;
wire();
}
function validateEditor(){if(state.page!=='editor')return;const e=state.editor;const validNumbers=[e.minutes,e.daily].every(n=>Number.isInteger(n)&&n>=1&&n<=1440);view.querySelector('[data-action=save-rule]').disabled=!validNumbers||!e.apps.length||(e.mode==='group'&&(e.apps.length<2||!e.name.trim()));view.querySelector('#f-setting-error').hidden=validNumbers;const moved=e.apps.filter(app=>{const r=ruleFor(app);return r&&r.id!==e.id;});view.querySelector('#f-transfer-note').textContent=moved.length?`${moved.join(', ')} will move from existing limits. Today’s allowance already used will carry over.`:'';}
function wire(){
view.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>act(b.dataset.action));view.querySelectorAll('[data-category]').forEach(b=>b.onclick=()=>{if(!allowance().remaining){state.page='shield';render();return;}draw(b.dataset.category);state.page='read';render();});
const txt=view.querySelector('#f-reflection');if(txt)txt.oninput=()=>{state.draft=txt.value;state.saved=false;const b=view.querySelector('[data-action=save]');b.disabled=!txt.value.trim();b.textContent='Save reflection';};
view.querySelectorAll('[data-rule]').forEach(b=>b.onclick=()=>beginEditor(b.dataset.rule));
view.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{state.editor.mode=b.dataset.mode;if(b.dataset.mode==='app')state.editor.apps=state.editor.apps.slice(0,1);render();});
view.querySelectorAll('[data-rule-app]').forEach(c=>c.onchange=()=>{const e=state.editor;if(e.mode==='app')e.apps=[c.dataset.ruleApp];else e.apps=c.checked?[...e.apps,c.dataset.ruleApp]:e.apps.filter(a=>a!==c.dataset.ruleApp);validateEditor();});
const groupName=view.querySelector('#f-group-name');if(groupName)groupName.oninput=()=>{state.editor.name=groupName.value;validateEditor();};
for(const [id,key] of [['f-minutes','minutes'],['f-daily','daily']]){const el=view.querySelector('#'+id);if(el)el.oninput=()=>{state.editor[key]=Number(el.value);validateEditor();};}
validateEditor();
const theme=view.querySelector('#f-theme');if(theme)theme.onchange=()=>{state.appearance=theme.value;render();};
view.querySelectorAll('[data-app]').forEach(c=>c.onchange=()=>{c.checked?state.selected.add(c.dataset.app):state.selected.delete(c.dataset.app);view.querySelector('[data-action=home]').disabled=!state.selected.size;});
const search=view.querySelector('#f-search');if(search)search.oninput=()=>{let visible=0;view.querySelectorAll('[data-app-row]').forEach(r=>{r.hidden=!r.dataset.appRow.toLowerCase().includes(search.value.toLowerCase());if(!r.hidden)visible++;});view.querySelector('#f-no-results').hidden=!!visible;};
if(globalThis.lucide)lucide.createIcons({attrs:{width:17,height:17}});
}
function act(action){
if(action==='home'&&state.page==='apps'){state.rules=state.rules.map(r=>({...r,apps:r.apps.filter(a=>state.selected.has(a))})).filter(r=>r.apps.length);for(const app of state.selected)if(!ruleFor(app))state.rules.push({id:'app-'+app,name:app,apps:[app],minutes:10,daily:30});}
if(action==='add-rule'){beginEditor();return;}
if(action==='cancel-editor'){state.editor=null;state.page='home';render();return;}
if(action==='save-rule'){if(saveRule())render();return;}
if(action==='save'){if(!state.draft.trim()||state.saved)return;state.entries.push({date:new Date().toLocaleDateString(undefined,{month:'short',day:'numeric'}),category:state.category,item:{...state.item},text:state.draft.trim()});state.saved=true;const b=view.querySelector('[data-action=save]');b.textContent='Saved';b.disabled=true;view.querySelector('#f-save-result').textContent='Saved to your reflections.';return;}
if(action==='continue'){if(state.exited)return;const minutes=grant();if(!minutes){state.page='shield';render();return;}state.exited=true;render();result.textContent=`Preview exit: ${state.app} would open for ${minutes} minutes. Other apps remain blocked.`;next.textContent="Preview after access expires";next.hidden=false;return;}
if(action==='leave'){state.exited=true;render();result.textContent=`Preview exit: Focus closes. No new access to ${state.app} is granted.`;next.textContent="Try another opening";next.hidden=false;return;}
state.exited=false;
if(action==='surprise'){if(!allowance().remaining){state.page='shield';render();return;}const cats=Object.keys(icons).filter(c=>c!==state.lastCategory);draw(cats[Math.floor(Math.random()*cats.length)]);state.page='read';}else state.page=action;
render();
}
root.querySelector('header [data-action=home]').onclick=()=>act('home');root.querySelector('#appearance').onclick=()=>{state.appearance=state.appearance==='light'?'dark':'light';render();};
screenPicker.onchange=()=>{const value=screenPicker.value;if(value==='reset'||value==='movement'){state.category=value==='reset'?'Reset':'Movement';state.item=library[state.category][0];state.draft='';state.saved=false;state.page='read';}else{state.page=value;if(value==='read'&&!state.item.url){state.category='Spiritual';state.item=library.Spiritual[0];state.draft='';state.saved=false;}}state.exited=false;render();};appPicker.onchange=()=>{state.app=appPicker.value;state.exited=false;render();};next.onclick=()=>{state.sessions[state.app]=0;state.page='shield';state.exited=false;render();};
const previewParams=new URLSearchParams(location.search),requestedScreen=previewParams.get('screen');
if(previewParams.get('embed')==='1')root.classList.add('is-embed');
if(previewParams.get('theme')==='dark')state.appearance='dark';
if(apps.includes(previewParams.get('app')))state.app=previewParams.get('app');
if(requestedScreen==='reset'||requestedScreen==='movement'||requestedScreen==='relationship'||requestedScreen==='entrepreneur'){
  state.category={reset:'Reset',movement:'Movement',relationship:'Relationships',entrepreneur:'Entrepreneur'}[requestedScreen];
  state.item=library[state.category][0];state.page='read';
}else if(['welcome','permission','apps','home','shield','choose','read','journal'].includes(requestedScreen)){
  state.page=requestedScreen;
}
render();
if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:render});tweak.addSelect(state,'appearance',{label:'Appearance',options:['light','dark']});}
})();
</script>

<script src="https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js"></script>
<script src="https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js"></script>
<script>
(() => {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set(["top", "right", "bottom", "left"]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (target) =>
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest("[data-tooltip]")
      : null;
  const containsTarget = (trigger, target) =>
    target?.nodeType != null && trigger.contains(target);
  const getContent = (trigger) =>
    trigger.getAttribute("data-tooltip")?.trim() ?? "";
  const getPlacement = (trigger) => {
    const placement = trigger.getAttribute("data-tooltip-placement");
    return tooltipPlacements.has(placement) ? placement : "top";
  };
  const getTooltip = () => {
    if (tooltip == null) {
      tooltip = document.createElement("div");
      tooltip.id = tooltipId;
      tooltip.className = "tooltip";
      tooltip.setAttribute("role", "tooltip");
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) => {
    const ids = new Set(
      (trigger.getAttribute("aria-describedby") ?? "")
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute("aria-describedby");
    } else {
      trigger.setAttribute("aria-describedby", [...ids].join(" "));
    }
  };
  const clearOpenTimeout = () => {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) => {
    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) => {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              "--tooltip-available-width",
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              "--tooltip-available-height",
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: "fixed",
    })
      .then(({ x, y }) => {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = "visible";
      })
      .catch(() => {
        if (activeTrigger === trigger && request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) => {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = "hidden";
    floating.style.transform = "translate(0, 0)";
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () => {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) => {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() < skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() => {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) => {
    if (event.pointerType === "touch") {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handlePointer = (event) => {
    lastPointerWasTouch =
      event.type === "pointerdown" && event.pointerType === "touch";
  };
  const handleTouchClick = (event) => {
    const isTouch = event.pointerType === "touch" || lastPointerWasTouch;
    lastPointerWasTouch = false;
    if (!isTouch || event.detail === 0) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (
      trigger == null ||
      !trigger.isConnected ||
      getContent(trigger).length === 0 ||
      (pinnedByTouch && activeTrigger === trigger)
    ) {
      if (pinnedByTouch) {
        closeTooltip();
      }
      return;
    }
    openTooltip(trigger);
    pinnedByTouch = activeTrigger === trigger;
    window.setTimeout(() => {
      if (activeTrigger === trigger && !trigger.isConnected) {
        closeTooltip(false);
      }
    }, 0);
  };
  const handleLeave = (event) => {
    if (pinnedByTouch) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) => {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(":focus-visible")) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) => {
    if (event.key === "Escape") {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) => {
    lastPointerWasTouch = false;
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () => {
    closeTooltip(false);
    lastPointerWasTouch = false;
    document.removeEventListener("pointerover", handlePointerOpen);
    document.removeEventListener("pointerdown", handlePointer);
    document.removeEventListener("pointercancel", handlePointer);
    document.removeEventListener("click", handleTouchClick);
    document.removeEventListener("pointerout", handleLeave);
    document.removeEventListener("focusin", handleFocusIn);
    document.removeEventListener("focusout", handleLeave);
    document.removeEventListener("keydown", handleKeyDown);
    document.removeEventListener("contextmenu", handleContextMenu);
    tooltip = null;
  };

  document.addEventListener("pointerover", handlePointerOpen);
  document.addEventListener("pointerdown", handlePointer);
  document.addEventListener("pointercancel", handlePointer);
  document.addEventListener("click", handleTouchClick);
  document.addEventListener("pointerout", handleLeave);
  document.addEventListener("focusin", handleFocusIn);
  document.addEventListener("focusout", handleLeave);
  document.addEventListener("keydown", handleKeyDown);
  document.addEventListener("contextmenu", handleContextMenu);
  window.addEventListener("pagehide", destroy, { once: true });
})();
</script>
<script id="codex-visualization-tabs">
(() => {
  const selector = '.nav[role="tablist"] [role="tab"]';
  const disabled = ':disabled,[aria-disabled="true"]';
  const selectTab = (selected) => {
    const panelId = selected.getAttribute("aria-controls");
    for (const tab of selected.closest('[role="tablist"]').querySelectorAll('[role="tab"]')) {
      const active = tab === selected;
      tab.classList.toggle("active", active);
      tab.setAttribute("aria-selected", String(active));
      const id = tab.getAttribute("aria-controls");
      const panel = id && document.getElementById(id);
      if (panel != null) {
        panel.hidden = id !== panelId;
        if (!panel.hidden && selected.id) {
          panel.setAttribute("aria-labelledby", selected.id);
        }
      }
    }
  };
  const interact = (event) => {
    const tab = event.target?.closest?.(selector);
    if (event.defaultPrevented || tab == null || tab.matches(disabled)) {
      return;
    }
    if (event.type === "click") {
      selectTab(tab);
      return;
    }
    const tabs = Array.from(
      tab.closest('[role="tablist"]').querySelectorAll('[role="tab"]'),
    ).filter((candidate) => !candidate.matches(disabled));
    const current = tabs.indexOf(tab);
    let next;
    if (event.key === "ArrowRight" || event.key === "ArrowDown") {
      next = (current + 1) % tabs.length;
    } else if (event.key === "ArrowLeft" || event.key === "ArrowUp") {
      next = (current + tabs.length - 1) % tabs.length;
    } else if (event.key === "Home") {
      next = 0;
    } else if (event.key === "End") {
      next = tabs.length - 1;
    } else {
      return;
    }
    event.preventDefault();
    tabs[next].focus();
    selectTab(tabs[next]);
  };

  for (const list of document.querySelectorAll('.nav[role="tablist"]')) {
    const selected =
      list.querySelector('[role="tab"][aria-selected="true"]') ??
      list.querySelector('[role="tab"].active') ??
      list.querySelector('[role="tab"]');
    if (selected != null) {
      selectTab(selected);
    }
  }
  document.addEventListener("click", interact);
  document.addEventListener("keydown", interact);
  window.addEventListener("pagehide", () => {
    document.removeEventListener("click", interact);
    document.removeEventListener("keydown", interact);
  }, { once: true });
})();
</script>
